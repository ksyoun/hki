[project]
name = "hki"
version = "0.1.0"
description = "교회 실시간 설교 번역 서비스"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "sounddevice>=0.5.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "openai>=1.60.0",
]

[project.scripts]
hki = "hki.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hki*"]
