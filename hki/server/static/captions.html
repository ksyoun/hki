<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HKI Traducción en Vivo</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 100%;
      padding: 0 1.25rem;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 3.5rem);
    }

    .caption-area {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 40%;
      max-height: 60%;
      gap: 0.6rem;
    }

    .line {
      transition: opacity 0.3s, transform 0.3s;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .line.old {
      font-size: clamp(0.85rem, 3vw, 1rem);
      color: #555;
      opacity: 0.6;
    }

    .line.recent {
      font-size: clamp(1rem, 3.5vw, 1.2rem);
      color: #aaa;
    }

    .line.final {
      font-size: clamp(1.2rem, 4.5vw, 1.6rem);
      color: #fff;
      font-weight: 500;
    }

    .line.slide-up {
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .status-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.6rem 1rem;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 0.6rem);
      background: rgba(0, 0, 0, 0.5);
      font-size: 0.8rem;
      color: #888;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e74c3c;
      animation: pulse 1.5s infinite;
    }

    .dot.paused { background: #e67e22; animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .pause-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(26, 26, 46, 0.85);
      font-size: 1.2rem;
      color: #e67e22;
      z-index: 10;
    }

    .hidden { display: none !important; }

    .hki-qr-btn {
      background: none; border: 1px solid #444; color: #aaa;
      padding: 0.3rem 0.55rem; font-size: 0.75rem; border-radius: 6px;
      cursor: pointer; margin-left: 0.5rem;
    }
    .hki-qr-btn:active { transform: scale(0.97); }

    .hki-speaker-btn {
      background: none; border: 1px solid #444; color: #aaa;
      padding: 0.3rem 0.55rem; font-size: 0.85rem; border-radius: 6px;
      cursor: pointer; margin-left: 0.5rem; min-width: 2.4rem;
    }
    .hki-speaker-btn:active { transform: scale(0.97); }
    .hki-speaker-btn.active { color: #4a6cf7; border-color: #4a6cf7; }
    .hki-speaker-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .speaker-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 1rem;
    }

    .speaker-modal {
      background: #252542;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      max-width: 22rem;
      text-align: center;
    }

    .speaker-modal p {
      font-size: 1rem;
      line-height: 1.45;
      color: #ddd;
      margin-bottom: 1.25rem;
    }

    .speaker-modal-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
    }

    .speaker-modal-actions button {
      flex: 1;
      padding: 0.55rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      border: none;
    }

    .speaker-modal-accept {
      background: #4a6cf7;
      color: #fff;
    }

    .speaker-modal-cancel {
      background: #3a3a55;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="pause-overlay hidden" id="pauseOverlay">
    Traducción en pausa
  </div>

  <div class="speaker-modal-backdrop hidden" id="speakerModal">
    <div class="speaker-modal">
      <p>Está entrando a modo voz. Tiene un poco más de demora que el subtítulo.</p>
      <div class="speaker-modal-actions">
        <button class="speaker-modal-cancel" id="speakerModalCancel" type="button">Cancelar</button>
        <button class="speaker-modal-accept" id="speakerModalAccept" type="button">Aceptar</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="caption-area" id="captionArea"></div>
  </div>

  <div class="status-bar">
    <span class="dot" id="liveDot"></span>
    <span id="statusText">LIVE</span>
    <span id="timerDisplay"></span>
    <button class="hki-speaker-btn" id="speakerBtn" type="button" title="Activar altavoz">🔈</button>
    <button class="hki-qr-btn" id="qrShareBtn" type="button">QR</button>
  </div>

  <script src="/static/qr-share.js"></script>
  <script>
    const MAX_FINAL = 3;
    const PENDING_CAPTION_TIMEOUT_MS = 12000;
    const area = document.getElementById("captionArea");
    const pauseOverlay = document.getElementById("pauseOverlay");
    const speakerModal = document.getElementById("speakerModal");
    const liveDot = document.getElementById("liveDot");
    const statusText = document.getElementById("statusText");
    const timerDisplay = document.getElementById("timerDisplay");

    let finals = [];
    let elapsedSec = 0;
    let state = "idle";
    let testMode = false;
    let ttsAvailable = false;
    let ws = null;

    function loadSpeakerEnabled() {
      const stored = localStorage.getItem("hki_speaker_enabled");
      if (stored === "true" || stored === "false") return stored === "true";
      const legacyMuted = localStorage.getItem("hki_speaker_muted");
      if (legacyMuted !== null) {
        const enabled = legacyMuted === "false";
        localStorage.setItem("hki_speaker_enabled", enabled ? "true" : "false");
        localStorage.removeItem("hki_speaker_muted");
        return enabled;
      }
      return false;
    }

    let speakerEnabled = loadSpeakerEnabled();
    let playbackSpeedThreshold = 3;
    let playbackSpeedMax = 1.15;
    let serverVoiceBacklog = 0;
    let pendingPlaybackCount = 0;
    let pendingCaptions = [];
    let pendingCaptionTimer = null;
    let fallbackShownIds = new Set();

    let audioCtx = null;
    let audioQueue = Promise.resolve();
    let currentSource = null;

    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws/live?role=audience`);
      ws.onopen = () => sendSpeakerSubscribe(speakerEnabled);
      ws.onmessage = (e) => handleEvent(JSON.parse(e.data));
      ws.onclose = () => setTimeout(connect, 3000);
    }

    function sendSpeakerSubscribe(enabled) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "speaker_subscribe", enabled }));
      }
    }

    function ensureAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({
          sampleRate: 24000,
        });
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function pcmToAudioBuffer(pcmB64, sampleRate) {
      const binary = atob(pcmB64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const int16 = new Int16Array(bytes.buffer);
      const ctx = ensureAudioContext();
      const buffer = ctx.createBuffer(1, int16.length, sampleRate);
      const channel = buffer.getChannelData(0);
      for (let i = 0; i < int16.length; i++) channel[i] = int16[i] / 32768;
      return buffer;
    }

    function getPlaybackDepth() {
      return pendingPlaybackCount + serverVoiceBacklog;
    }

    function playbackRateForDepth(depth) {
      if (depth <= playbackSpeedThreshold) return 1.0;
      if (depth <= 6) return 1.1;
      return playbackSpeedMax;
    }

    function stopAudioPlayback() {
      if (currentSource) {
        try { currentSource.stop(); } catch (_) {}
        currentSource = null;
      }
      audioQueue = Promise.resolve();
      pendingPlaybackCount = 0;
    }

    function clearPendingCaptions() {
      pendingCaptions = [];
      fallbackShownIds.clear();
      if (pendingCaptionTimer) {
        clearInterval(pendingCaptionTimer);
        pendingCaptionTimer = null;
      }
    }

    function startPendingCaptionTimer() {
      if (pendingCaptionTimer) return;
      pendingCaptionTimer = setInterval(() => {
        const now = Date.now();
        while (pendingCaptions.length && now - pendingCaptions[0].ts >= PENDING_CAPTION_TIMEOUT_MS) {
          const entry = pendingCaptions.shift();
          fallbackShownIds.add(entry.itemId);
          confirmFinal(entry.itemId, entry.text);
        }
        if (!pendingCaptions.length && pendingCaptionTimer) {
          clearInterval(pendingCaptionTimer);
          pendingCaptionTimer = null;
        }
      }, 500);
    }

    function queuePendingCaption(itemId, text) {
      pendingCaptions.push({ itemId, text, ts: Date.now() });
      startPendingCaptionTimer();
    }

    function flushPendingCaptionsOnTts(itemIds) {
      const ids = new Set(itemIds || []);
      pendingCaptions = pendingCaptions.filter((p) => !ids.has(p.itemId));
      if (!pendingCaptions.length && pendingCaptionTimer) {
        clearInterval(pendingCaptionTimer);
        pendingCaptionTimer = null;
      }
    }

    function enqueueAudio(pcmB64, sampleRate) {
      pendingPlaybackCount++;
      audioQueue = audioQueue.then(() => new Promise((resolve) => {
        pendingPlaybackCount = Math.max(0, pendingPlaybackCount - 1);
        const buffer = pcmToAudioBuffer(pcmB64, sampleRate);
        const ctx = ensureAudioContext();
        const src = ctx.createBufferSource();
        src.buffer = buffer;
        const rate = playbackRateForDepth(getPlaybackDepth());
        src.playbackRate.value = rate;
        src.connect(ctx.destination);
        currentSource = src;
        src.onended = () => {
          if (currentSource === src) currentSource = null;
          resolve();
        };
        src.start();
      }));
    }

    function updateSpeakerButton() {
      const btn = document.getElementById("speakerBtn");
      if (!ttsAvailable) {
        btn.disabled = true;
        btn.textContent = "🔈";
        btn.title = "Altavoz no disponible";
        btn.classList.remove("active");
        return;
      }
      btn.disabled = false;
      if (!speakerEnabled) {
        btn.textContent = "🔈";
        btn.title = "Activar altavoz";
        btn.classList.remove("active");
      } else {
        btn.textContent = "🔊";
        btn.title = "Silenciar altavoz";
        btn.classList.add("active");
      }
    }

    function setSpeakerEnabled(enabled) {
      speakerEnabled = enabled;
      localStorage.setItem("hki_speaker_enabled", enabled ? "true" : "false");
      if (enabled) {
        ensureAudioContext();
      } else {
        stopAudioPlayback();
        clearPendingCaptions();
      }
      sendSpeakerSubscribe(enabled);
      updateSpeakerButton();
    }

    function showSpeakerModal() {
      speakerModal.classList.remove("hidden");
    }

    function hideSpeakerModal() {
      speakerModal.classList.add("hidden");
    }

    function updateVoiceBacklog(ev) {
      if (ev.voice_backlog !== undefined) {
        serverVoiceBacklog = ev.voice_backlog;
      } else {
        const prep = ev.tts_prep_pending || 0;
        const tts = ev.tts_pending || 0;
        serverVoiceBacklog = prep + tts;
      }
    }

    function handleEvent(ev) {
      if (ev.type === "translation") {
        if (!speakerEnabled) {
          confirmFinal(ev.item_id, ev.es);
        } else {
          queuePendingCaption(ev.item_id, ev.es);
        }
      } else if (ev.type === "status") {
        state = ev.state;
        elapsedSec = ev.elapsed_sec || 0;
        if (ev.test_mode !== undefined) testMode = ev.test_mode;
        if (ev.tts_available !== undefined) {
          ttsAvailable = ev.tts_available;
          updateSpeakerButton();
        }
        if (ev.tts_playback_speed_threshold !== undefined) {
          playbackSpeedThreshold = ev.tts_playback_speed_threshold;
        }
        if (ev.tts_playback_speed_max !== undefined) {
          playbackSpeedMax = ev.tts_playback_speed_max;
        }
        updateVoiceBacklog(ev);
        updateStatus();
      } else if (ev.type === "tts") {
        updateVoiceBacklog(ev);
        if (speakerEnabled && ttsAvailable) {
          const itemIds = ev.item_ids && ev.item_ids.length ? ev.item_ids : [ev.item_id];
          const alreadyShown = itemIds.some((id) => fallbackShownIds.has(id));
          flushPendingCaptionsOnTts(itemIds);
          itemIds.forEach((id) => fallbackShownIds.delete(id));
          if (!alreadyShown) {
            confirmFinal(ev.item_id, ev.es);
          }
          enqueueAudio(ev.audio, ev.rate || 24000);
        }
      } else if (ev.type === "paused") {
        state = "paused";
        stopAudioPlayback();
        clearPendingCaptions();
        pauseOverlay.classList.remove("hidden");
        updateStatus();
      } else if (ev.type === "resumed") {
        state = "streaming";
        pauseOverlay.classList.add("hidden");
        updateStatus();
      }
    }

    function confirmFinal(itemId, text) {
      const el = document.createElement("div");
      el.className = "line final slide-up";
      el.textContent = text;
      area.appendChild(el);

      finals.push(el);
      if (finals.length > MAX_FINAL) {
        const old = finals.shift();
        old.classList.remove("final");
        old.classList.add("old");
        setTimeout(() => old.remove(), 500);
      }

      updateFinalStyles();
      scrollToBottom();
    }

    function updateFinalStyles() {
      const n = finals.length;
      finals.forEach((el, i) => {
        el.className = "line";
        if (i === n - 1) {
          el.classList.add("final");
        } else if (i === n - 2) {
          el.classList.add("recent");
        } else {
          el.classList.add("old");
        }
      });
    }

    function scrollToBottom() {
      area.scrollTop = area.scrollHeight;
    }

    function updateStatus() {
      if (state === "paused") {
        liveDot.classList.add("paused");
        statusText.textContent = "PAUSA";
      } else if (state === "streaming") {
        liveDot.classList.remove("paused");
        statusText.textContent = testMode ? "PRUEBA" : "EN VIVO";
      } else {
        liveDot.classList.add("paused");
        statusText.textContent = "APAGADO";
      }
      const h = String(Math.floor(elapsedSec / 3600)).padStart(2, "0");
      const m = String(Math.floor((elapsedSec % 3600) / 60)).padStart(2, "0");
      const s = String(elapsedSec % 60).padStart(2, "0");
      timerDisplay.textContent = `${h}:${m}:${s}`;
    }

    setInterval(() => {
      if (state === "streaming") {
        elapsedSec++;
        updateStatus();
      }
    }, 1000);

    document.getElementById("qrShareBtn").onclick = () => {
      window.HKIQR.open(location.href);
    };

    document.getElementById("speakerBtn").onclick = () => {
      if (!ttsAvailable) return;
      if (speakerEnabled) {
        setSpeakerEnabled(false);
      } else {
        showSpeakerModal();
      }
    };

    document.getElementById("speakerModalAccept").onclick = () => {
      hideSpeakerModal();
      setSpeakerEnabled(true);
    };

    document.getElementById("speakerModalCancel").onclick = () => {
      hideSpeakerModal();
    };

    updateSpeakerButton();
    connect();
  </script>
</body>
</html>
