<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HKI Traducción en Vivo</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    .container {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 100%;
      padding: 0 1.25rem;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 3.5rem);
    }

    .caption-area {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 40%;
      max-height: 60%;
      gap: 0.6rem;
    }

    .line {
      transition: opacity 0.3s, transform 0.3s;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .line.old {
      font-size: clamp(0.85rem, 3vw, 1rem);
      color: #555;
      opacity: 0.6;
    }

    .line.recent {
      font-size: clamp(1rem, 3.5vw, 1.2rem);
      color: #aaa;
    }

    .line.final {
      font-size: clamp(1.2rem, 4.5vw, 1.6rem);
      color: #fff;
      font-weight: 500;
    }

    .line.slide-up {
      animation: slideUp 0.3s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .status-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.6rem 1rem;
      padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 0.6rem);
      background: rgba(0, 0, 0, 0.5);
      font-size: 0.8rem;
      color: #888;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e74c3c;
      animation: pulse 1.5s infinite;
    }

    .dot.paused { background: #e67e22; animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .pause-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(26, 26, 46, 0.85);
      font-size: 1.2rem;
      color: #e67e22;
      z-index: 10;
    }

    .hidden { display: none !important; }

    .hki-qr-btn {
      background: none; border: 1px solid #444; color: #aaa;
      padding: 0.3rem 0.55rem; font-size: 0.75rem; border-radius: 6px;
      cursor: pointer; margin-left: 0.5rem;
    }
    .hki-qr-btn:active { transform: scale(0.97); }

    .hki-speaker-btn {
      background: none; border: 1px solid #444; color: #aaa;
      padding: 0.3rem 0.55rem; font-size: 0.85rem; border-radius: 6px;
      cursor: pointer; margin-left: 0.5rem; min-width: 2.4rem;
    }
    .hki-speaker-btn:active { transform: scale(0.97); }
    .hki-speaker-btn.active { color: #4a6cf7; border-color: #4a6cf7; }
    .hki-speaker-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="pause-overlay hidden" id="pauseOverlay">
    Traducción en pausa
  </div>

  <div class="container">
    <div class="caption-area" id="captionArea"></div>
  </div>

  <div class="status-bar">
    <span class="dot" id="liveDot"></span>
    <span id="statusText">LIVE</span>
    <span id="timerDisplay"></span>
    <button class="hki-speaker-btn" id="speakerBtn" type="button" title="Activar altavoz">🔈</button>
    <button class="hki-qr-btn" id="qrShareBtn" type="button">QR</button>
  </div>

  <script src="/static/qr-share.js"></script>
  <script>
    const MAX_FINAL = 3;
    const area = document.getElementById("captionArea");
    const pauseOverlay = document.getElementById("pauseOverlay");
    const liveDot = document.getElementById("liveDot");
    const statusText = document.getElementById("statusText");
    const timerDisplay = document.getElementById("timerDisplay");

    let finals = [];
    let elapsedSec = 0;
    let state = "idle";
    let testMode = false;
    let ttsAvailable = false;
    let ws = null;

    let speakerMuted = localStorage.getItem("hki_speaker_muted") !== "false";
    let audioCtx = null;
    let audioQueue = Promise.resolve();
    let currentSource = null;

    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(`${proto}://${location.host}/ws/live?role=audience`);
      ws.onopen = () => sendSpeakerSubscribe(!speakerMuted);
      ws.onmessage = (e) => handleEvent(JSON.parse(e.data));
      ws.onclose = () => setTimeout(connect, 3000);
    }

    function sendSpeakerSubscribe(enabled) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: "speaker_subscribe", enabled }));
      }
    }

    function ensureAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({
          sampleRate: 24000,
        });
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function pcmToAudioBuffer(pcmB64, sampleRate) {
      const binary = atob(pcmB64);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      const int16 = new Int16Array(bytes.buffer);
      const ctx = ensureAudioContext();
      const buffer = ctx.createBuffer(1, int16.length, sampleRate);
      const channel = buffer.getChannelData(0);
      for (let i = 0; i < int16.length; i++) channel[i] = int16[i] / 32768;
      return buffer;
    }

    function stopAudioPlayback() {
      if (currentSource) {
        try { currentSource.stop(); } catch (_) {}
        currentSource = null;
      }
      audioQueue = Promise.resolve();
    }

    function enqueueAudio(pcmB64, sampleRate) {
      audioQueue = audioQueue.then(() => new Promise((resolve) => {
        const buffer = pcmToAudioBuffer(pcmB64, sampleRate);
        const ctx = ensureAudioContext();
        const src = ctx.createBufferSource();
        src.buffer = buffer;
        src.connect(ctx.destination);
        currentSource = src;
        src.onended = () => {
          if (currentSource === src) currentSource = null;
          resolve();
        };
        src.start();
      }));
    }

    function updateSpeakerButton() {
      const btn = document.getElementById("speakerBtn");
      if (!ttsAvailable) {
        btn.disabled = true;
        btn.textContent = "🔈";
        btn.title = "Altavoz no disponible";
        btn.classList.remove("active");
        return;
      }
      btn.disabled = false;
      if (speakerMuted) {
        btn.textContent = "🔈";
        btn.title = "Activar altavoz";
        btn.classList.remove("active");
      } else {
        btn.textContent = "🔊";
        btn.title = "Silenciar altavoz";
        btn.classList.add("active");
      }
    }

    function setSpeakerMuted(muted) {
      speakerMuted = muted;
      localStorage.setItem("hki_speaker_muted", muted ? "true" : "false");
      if (!muted) ensureAudioContext();
      else stopAudioPlayback();
      sendSpeakerSubscribe(!muted);
      updateSpeakerButton();
    }

    function handleEvent(ev) {
      if (ev.type === "translation") {
        confirmFinal(ev.item_id, ev.es);
      } else if (ev.type === "status") {
        state = ev.state;
        elapsedSec = ev.elapsed_sec || 0;
        if (ev.test_mode !== undefined) testMode = ev.test_mode;
        if (ev.tts_available !== undefined) {
          ttsAvailable = ev.tts_available;
          updateSpeakerButton();
        }
        updateStatus();
      } else if (ev.type === "tts") {
        if (!speakerMuted && ttsAvailable) {
          enqueueAudio(ev.audio, ev.rate || 24000);
        }
      } else if (ev.type === "paused") {
        state = "paused";
        stopAudioPlayback();
        pauseOverlay.classList.remove("hidden");
        updateStatus();
      } else if (ev.type === "resumed") {
        state = "streaming";
        pauseOverlay.classList.add("hidden");
        updateStatus();
      }
    }

    function confirmFinal(itemId, text) {
      const el = document.createElement("div");
      el.className = "line final slide-up";
      el.textContent = text;
      area.appendChild(el);

      finals.push(el);
      if (finals.length > MAX_FINAL) {
        const old = finals.shift();
        old.classList.remove("final");
        old.classList.add("old");
        setTimeout(() => old.remove(), 500);
      }

      updateFinalStyles();
      scrollToBottom();
    }

    function updateFinalStyles() {
      const n = finals.length;
      finals.forEach((el, i) => {
        el.className = "line";
        if (i === n - 1) {
          el.classList.add("final");
        } else if (i === n - 2) {
          el.classList.add("recent");
        } else {
          el.classList.add("old");
        }
      });
    }

    function scrollToBottom() {
      area.scrollTop = area.scrollHeight;
    }

    function updateStatus() {
      if (state === "paused") {
        liveDot.classList.add("paused");
        statusText.textContent = "PAUSA";
      } else if (state === "streaming") {
        liveDot.classList.remove("paused");
        statusText.textContent = testMode ? "PRUEBA" : "EN VIVO";
      } else {
        liveDot.classList.add("paused");
        statusText.textContent = "APAGADO";
      }
      const h = String(Math.floor(elapsedSec / 3600)).padStart(2, "0");
      const m = String(Math.floor((elapsedSec % 3600) / 60)).padStart(2, "0");
      const s = String(elapsedSec % 60).padStart(2, "0");
      timerDisplay.textContent = `${h}:${m}:${s}`;
    }

    setInterval(() => {
      if (state === "streaming") {
        elapsedSec++;
        updateStatus();
      }
    }, 1000);

    document.getElementById("qrShareBtn").onclick = () => {
      window.HKIQR.open(location.href);
    };

    document.getElementById("speakerBtn").onclick = () => {
      if (!ttsAvailable) return;
      setSpeakerMuted(!speakerMuted);
    };

    updateSpeakerButton();
    connect();
  </script>
</body>
</html>
