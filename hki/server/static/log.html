<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HKI — Registro de sesión</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { min-height: 100vh; }
    .container { max-width: 820px; margin: 0 auto; padding: 1.25rem 1.5rem 2rem; }
    header { margin-bottom: 1rem; }
    header h1 { font-size: 1.2rem; margin-bottom: 0.25rem; }
    .subtitle { font-size: 0.85rem; color: #8888aa; }
    .tabs { display: flex; gap: 0.5rem; margin: 1rem 0; flex-wrap: wrap; }
    .tab {
      flex: 1; min-width: 8rem; padding: 0.65rem; border: 1px solid #2a2a3e; border-radius: 8px;
      background: #12121f; color: #8888aa; cursor: pointer; font-size: 0.85rem;
    }
    .tab.active { background: #4a6cf7; border-color: #4a6cf7; color: #fff; }
    .log-panel {
      background: #12121f; border-radius: 8px; padding: 1rem;
      min-height: 50vh; max-height: calc(100vh - 220px);
      overflow-y: auto; line-height: 1.55; font-size: 0.95rem;
    }
    .log-line { margin-bottom: 0.85rem; padding-bottom: 0.85rem; border-bottom: 1px solid #1e1e30; }
    .log-line.comment {
      color: #8888aa;
      font-size: 0.85rem;
      border-bottom: none;
      padding-top: 0.75rem;
      white-space: pre-wrap;
    }
    .empty { color: #666; text-align: center; padding: 3rem 1rem; }
    .actions { margin-top: 1rem; display: flex; gap: 0.5rem; }
    .actions button { flex: 1; }
    .count { font-size: 0.8rem; color: #666; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Registro de sesión</h1>
      <div class="subtitle" id="sessionLabel">Cargando...</div>
    </header>

    <div class="tabs">
      <button class="tab active" id="tabKo" type="button">한국어 (STT)</button>
      <button class="tab" id="tabLegacy" type="button">Clásico (ES)</button>
      <button class="tab" id="tabSentence" type="button">Por oración (ES)</button>
    </div>

    <div class="log-panel" id="logPanel">
      <div class="empty">Cargando...</div>
    </div>
    <div class="count" id="lineCount"></div>

    <div class="actions">
      <button class="btn-primary" id="downloadBtn" type="button">Descargar</button>
      <button class="btn-secondary" id="closeBtn" type="button">Cerrar</button>
    </div>
  </div>

  <script>
    let tab = "ko";
    let data = {
      transcripts: [],
      translations: [],
      translations_legacy: [],
      translations_sentence: [],
      session_label: "",
    };

    function linesFor(which) {
      if (which === "ko") return data.transcripts || [];
      if (which === "sentence") return data.translations_sentence || [];
      return data.translations_legacy || data.translations || [];
    }

    function render() {
      const lines = linesFor(tab);
      const panel = document.getElementById("logPanel");
      const comment = (data.token_comment || "").trim();
      if (!lines.length && !comment) {
        panel.innerHTML = '<div class="empty">No hay contenido en esta sesión.</div>';
      } else {
        const body = lines
          .map((t) => `<div class="log-line">${escapeHtml(t)}</div>`)
          .join("");
        const note = comment
          ? `<div class="log-line comment">${escapeHtml(comment)}</div>`
          : "";
        panel.innerHTML = body + note;
      }
      document.getElementById("lineCount").textContent =
        `${lines.length} ${lines.length === 1 ? "línea" : "líneas"}`;
    }

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function setTab(next) {
      tab = next;
      document.getElementById("tabKo").classList.toggle("active", tab === "ko");
      document.getElementById("tabLegacy").classList.toggle("active", tab === "legacy");
      document.getElementById("tabSentence").classList.toggle("active", tab === "sentence");
      render();
    }

    function downloadFilename() {
      const date = new Date().toISOString().slice(0, 10);
      const label = (data.session_label || "sesion")
        .replace(/[^\w\-]+/g, "_")
        .slice(0, 40);
      const suffix = tab === "ko" ? "ko" : tab === "sentence" ? "es-oracion" : "es-clasico";
      return `HKI-${date}-${label}-${suffix}.txt`;
    }

    function download() {
      const lines = linesFor(tab);
      const comment = (data.token_comment || "").trim();
      if (!lines.length && !comment) return;
      const body = [...lines, comment].filter(Boolean).join("\n\n");
      const blob = new Blob([body], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = downloadFilename();
      a.click();
      URL.revokeObjectURL(a.href);
    }

    async function load() {
      const res = await fetch("/api/live/log");
      data = await res.json();
      document.getElementById("sessionLabel").textContent =
        data.session_label ? `Sesión: ${data.session_label}` : "Sesión anterior";
      render();
    }

    document.getElementById("tabKo").onclick = () => setTab("ko");
    document.getElementById("tabLegacy").onclick = () => setTab("legacy");
    document.getElementById("tabSentence").onclick = () => setTab("sentence");
    document.getElementById("downloadBtn").onclick = download;
    document.getElementById("closeBtn").onclick = () => window.close();

    load();
  </script>
</body>
</html>
