<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HKI — Registro de sesión</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { min-height: 100vh; }
    .container { max-width: 820px; margin: 0 auto; padding: 1.25rem 1.5rem 2rem; }
    header { margin-bottom: 1rem; }
    header h1 { font-size: 1.2rem; margin-bottom: 0.25rem; }
    .subtitle { font-size: 0.85rem; color: #8888aa; }
    .tabs { display: flex; gap: 0.5rem; margin: 1rem 0; flex-wrap: wrap; }
    .tab {
      flex: 1; min-width: 8rem; padding: 0.65rem; border: 1px solid #2a2a3e; border-radius: 8px;
      background: #12121f; color: #8888aa; cursor: pointer; font-size: 0.85rem;
    }
    .tab.active { background: #4a6cf7; border-color: #4a6cf7; color: #fff; }
    .log-panel {
      background: #12121f; border-radius: 8px; padding: 1rem;
      min-height: 50vh; max-height: calc(100vh - 220px);
      overflow-y: auto; line-height: 1.55; font-size: 0.95rem;
    }
    .log-line { margin-bottom: 0.85rem; padding-bottom: 0.85rem; border-bottom: 1px solid #1e1e30; }
    .log-line.comment {
      color: #8888aa;
      font-size: 0.85rem;
      border-bottom: none;
      padding-top: 0.75rem;
      white-space: pre-wrap;
    }
    .empty { color: #666; text-align: center; padding: 3rem 1rem; }
    .actions { margin-top: 1rem; display: flex; gap: 0.5rem; }
    .actions button { flex: 1; }
    .log-line.hold { color: #8888aa; font-size: 0.85rem; }
    .log-meta { font-size: 0.75rem; color: #666; margin-top: 0.35rem; }
    .log-step { margin: 0.2rem 0; }
    .log-step .lbl { color: #8888aa; font-size: 0.75rem; margin-right: 0.35rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Registro de sesión</h1>
      <div class="subtitle" id="sessionLabel">Cargando...</div>
    </header>

    <div class="tabs">
      <button class="tab active" id="tabKo" type="button">한국어 (STT)</button>
      <button class="tab" id="tabLegacy" type="button">Clásico (ES)</button>
      <button class="tab" id="tabSentence" type="button">Por oración (ES)</button>
    </div>

    <div class="log-panel" id="logPanel">
      <div class="empty">Cargando...</div>
    </div>
    <div class="count" id="lineCount"></div>

    <div class="actions">
      <button class="btn-primary" id="downloadBtn" type="button">Descargar</button>
      <button class="btn-secondary" id="closeBtn" type="button">Cerrar</button>
    </div>
  </div>

  <script>
    let tab = "ko";
    let data = {
      transcripts: [],
      translations: [],
      translations_legacy: [],
      translations_sentence: [],
      sentence_traces: [],
      legacy_traces: [],
      session_label: "",
    };

    function linesFor(which) {
      if (which === "ko") return data.transcripts || [];
      if (which === "sentence") return data.translations_sentence || [];
      return data.translations_legacy || data.translations || [];
    }

    function tracesFor(which) {
      if (which === "sentence") return data.sentence_traces || [];
      if (which === "legacy") return data.legacy_traces || [];
      return [];
    }

    function formatTraceText(t) {
      const parts = [
        `[${t.action || "?"} ${t.release_reason || ""}]`.trim(),
        `STT: ${t.original_stt || ""}`,
      ];
      if (t.ko_corrected) parts.push(`KO: ${t.ko_corrected}`);
      if (t.joined_preview && t.joined_preview !== t.translation) {
        parts.push(`ES frag: ${t.joined_preview}`);
      }
      if (t.translation) parts.push(`ES: ${t.translation}`);
      const lat = [
        `through_index=${t.through_index ?? ""}`,
        `stt_repair=${!!t.stt_repair}`,
        `u=${t.latency_understand ?? 0}ms`,
        `t=${t.latency_translate ?? 0}ms`,
      ];
      if (t.latency_recombine) lat.push(`r=${t.latency_recombine}ms`);
      if (t.had_incierto) lat.push("incierto");
      if (t.anchor_repair) lat.push("anchor_repair");
      parts.push(lat.join(" "));
      return parts.filter(Boolean).join("\n");
    }

    function renderTrace(t) {
      const isRelease = t.action === "release" && (t.translation || "").trim();
      const cls = isRelease ? "log-line" : "log-line hold";
      const meta = [
        t.release_reason || t.action || "",
        `idx ${t.through_index ?? 0}`,
        t.stt_repair ? "stt_repair" : "",
        t.repair_rejected ? "repair_rejected" : "",
        t.anchor_repair ? "anchor_repair" : "",
        t.had_incierto ? "incierto" : "",
        (t.latency_understand || 0) ? `u ${t.latency_understand}ms` : "",
        isRelease && (t.latency_translate || 0) ? `t ${t.latency_translate}ms` : "",
        isRelease && (t.latency_recombine || 0) ? `r ${t.latency_recombine}ms` : "",
      ].filter(Boolean).join(" · ");
      if (!isRelease) {
        return `<div class="${cls}">${escapeHtml(t.original_stt || "(hold)")}` +
          `<div class="log-meta">${escapeHtml(meta)}</div></div>`;
      }
      const corr = (t.ko_corrected && t.ko_corrected !== t.original_stt)
        ? `<div class="log-step"><span class="lbl">KO</span>${escapeHtml(t.ko_corrected)}</div>`
        : "";
      const frag = (t.joined_preview && t.joined_preview !== t.translation)
        ? `<div class="log-step"><span class="lbl">ES frag</span>${escapeHtml(t.joined_preview)}</div>`
        : "";
      return `<div class="${cls}">` +
        `<div class="log-step"><span class="lbl">STT</span>${escapeHtml(t.original_stt || "")}</div>` +
        corr +
        frag +
        `<div class="log-step"><span class="lbl">ES</span>${escapeHtml(t.translation || "")}</div>` +
        `<div class="log-meta">${escapeHtml(meta)}</div></div>`;
    }

    function render() {
      const panel = document.getElementById("logPanel");
      const comment = (data.token_comment || "").trim();
      const traces = tracesFor(tab);
      const useTraces = traces.length > 0;
      const lines = useTraces ? traces : linesFor(tab);
      if (!lines.length && !comment) {
        panel.innerHTML = '<div class="empty">No hay contenido en esta sesión.</div>';
      } else {
        const body = useTraces
          ? traces.map(renderTrace).join("")
          : lines.map((t) => `<div class="log-line">${escapeHtml(t)}</div>`).join("");
        const note = comment
          ? `<div class="log-line comment">${escapeHtml(comment)}</div>`
          : "";
        panel.innerHTML = body + note;
      }
      const n = useTraces
        ? traces.filter((t) => t.action === "release" && (t.translation || "").trim()).length
        : lines.length;
      document.getElementById("lineCount").textContent =
        `${n} ${n === 1 ? "línea" : "líneas"}`;
    }

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function setTab(next) {
      tab = next;
      document.getElementById("tabKo").classList.toggle("active", tab === "ko");
      document.getElementById("tabLegacy").classList.toggle("active", tab === "legacy");
      document.getElementById("tabSentence").classList.toggle("active", tab === "sentence");
      render();
    }

    function downloadFilename() {
      const date = new Date().toISOString().slice(0, 10);
      const label = (data.session_label || "sesion")
        .replace(/[^\w\-]+/g, "_")
        .slice(0, 40);
      const suffix = tab === "ko" ? "ko" : tab === "sentence" ? "es-oracion" : "es-clasico";
      return `HKI-${date}-${label}-${suffix}.txt`;
    }

    function download() {
      const comment = (data.token_comment || "").trim();
      const traces = tracesFor(tab);
      let body = "";
      if (traces.length) {
        body = traces.map(formatTraceText).join("\n\n");
        if (comment) body += "\n\n" + comment;
      } else {
        const lines = linesFor(tab);
        if (!lines.length && !comment) return;
        body = [...lines, comment].filter(Boolean).join("\n\n");
      }
      if (!body.trim()) return;
      const blob = new Blob([body], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = downloadFilename();
      a.click();
      URL.revokeObjectURL(a.href);
    }

    async function load() {
      const res = await fetch("/api/live/log");
      data = await res.json();
      document.getElementById("sessionLabel").textContent =
        data.session_label ? `Sesión: ${data.session_label}` : "Sesión anterior";
      render();
    }

    document.getElementById("tabKo").onclick = () => setTab("ko");
    document.getElementById("tabLegacy").onclick = () => setTab("legacy");
    document.getElementById("tabSentence").onclick = () => setTab("sentence");
    document.getElementById("downloadBtn").onclick = download;
    document.getElementById("closeBtn").onclick = () => window.close();

    load();
  </script>
</body>
</html>
