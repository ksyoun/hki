<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HKI — Patrones de voz</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { min-height: 100vh; }
    .container { max-width: 920px; margin: 0 auto; padding: 1.25rem 1.5rem 2rem; }
    header h1 { font-size: 1.2rem; margin-bottom: 0.25rem; }
    .subtitle { font-size: 0.85rem; color: #8888aa; margin-bottom: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.75rem; margin-bottom: 1rem; }
    .stat-card { background: #12121f; border-radius: 8px; padding: 0.85rem; }
    .stat-card h3 { font-size: 0.75rem; color: #8888aa; margin-bottom: 0.35rem; font-weight: normal; }
    .stat-card .value { font-size: 1.4rem; font-weight: 700; }
    .stat-card .sub { font-size: 0.75rem; color: #666; margin-top: 0.25rem; }
    .section { margin-bottom: 1.25rem; }
    .section h2 { font-size: 0.95rem; margin-bottom: 0.5rem; }
    .hero-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .hero-table th, .hero-table td { text-align: left; padding: 0.55rem 0.5rem; border-bottom: 1px solid #1e1e30; }
    .hero-table th { color: #8888aa; font-weight: 500; }
    .hero-table tr.highlight td { background: rgba(74, 108, 247, 0.08); }
    .hero-table .depth { font-weight: 600; }
    .table-wrap { overflow-x: auto; background: #12121f; border-radius: 8px; padding: 0.5rem; }
    .hint-card {
      background: #12121f; border-left: 3px solid #4a6cf7; border-radius: 6px;
      padding: 0.75rem 0.85rem; margin-bottom: 0.6rem; font-size: 0.85rem; line-height: 1.45;
    }
    .hint-card.warning { border-left-color: #e67e22; }
    .hint-card.info { border-left-color: #888; }
    .config-list { font-size: 0.8rem; color: #8888aa; line-height: 1.6; }
    .empty { text-align: center; color: #666; padding: 3rem 1rem; }
    .actions { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
    .actions button { flex: 1; min-width: 120px; }
    details { background: #12121f; border-radius: 8px; padding: 0.65rem 0.85rem; }
    details summary { cursor: pointer; font-size: 0.85rem; color: #c8c8d8; }
    table.raw { width: 100%; border-collapse: collapse; font-size: 0.75rem; margin-top: 0.75rem; }
    table.raw th, table.raw td { text-align: left; padding: 0.35rem 0.3rem; border-bottom: 1px solid #1e1e30; }
    .session-pick { margin-bottom: 1rem; font-size: 0.85rem; }
    .session-pick select { margin-left: 0.5rem; max-width: 320px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Patrones de voz y proyección de buffer TTS</h1>
      <div class="subtitle" id="sessionLabel">Cargando...</div>
    </header>

    <div class="session-pick hidden" id="sessionPick">
      <label>Sesión guardada:
        <select id="sessionSelect"></select>
      </label>
    </div>

    <div id="content">
      <div class="empty">Cargando informe...</div>
    </div>

    <div class="actions">
      <button class="btn-secondary hidden" id="closeBtn" type="button">Cerrar</button>
    </div>
  </div>

  <script>
    function fmtSec(ms) {
      if (ms == null) return "—";
      return `${(ms / 1000).toFixed(1)}s`;
    }

    function fmtMs(stats) {
      if (!stats || stats.count === 0) return "—";
      return `${stats.p50}ms <span class="sub">(p95 ${stats.p95})</span>`;
    }

    function escapeHtml(s) {
      const d = document.createElement("div");
      d.textContent = s;
      return d.innerHTML;
    }

    function render(data) {
      const label = data.session_label || "transmisión";
      const count = data.utterance_count || 0;
      const upm = data.utterances_per_minute;
      document.getElementById("sessionLabel").textContent =
        `Sesión: ${label} · ${count} frases` +
        (upm != null ? ` · ${upm} frases/min` : "");

      const bp = data.buffer_projection || {};
      const depths = Object.keys(bp).sort((a, b) => Number(a) - Number(b));
      const s = data.summary || {};
      const cfg = data.config || {};

      let hero = `<div class="section"><h2>Retraso estimado por buffer (N frases)</h2>
        <div class="table-wrap"><table class="hero-table"><thead><tr>
          <th>N</th><th>Total p50</th><th>Total p95</th>
          <th>Contenido</th><th>Traducción</th><th>TTS</th><th>Polish</th>
        </tr></thead><tbody>`;

      depths.forEach((d) => {
        const row = bp[d] || {};
        const total = row.total_est_ms || {};
        const highlight = d === "5" ? " highlight" : "";
        hero += `<tr class="${highlight}">
          <td class="depth">${d}</td>
          <td><strong>${fmtSec(total.p50)}</strong></td>
          <td>${fmtSec(total.p95)}</td>
          <td>${fmtSec((row.content_span_ms || {}).p50)}</td>
          <td>${fmtSec((row.translation_sum_ms || {}).p50)}</td>
          <td>${fmtSec((row.tts_playback_sum_ms || {}).p50)}</td>
          <td>${fmtSec(row.polish_ms)}</td>
        </tr>`;
      });
      hero += `</tbody></table></div>
        <p style="font-size:0.75rem;color:#666;margin-top:0.5rem">
          Total ≈ tiempo de habla (N frases) + traducción + lectura TTS + polish reservado.
        </p></div>`;

      let html = hero + `<div class="section"><div class="grid">
        <div class="stat-card">
          <h3>Traducción por frase</h3>
          <div class="value">${s.translation_ms?.p50 ?? "—"}<span style="font-size:0.8rem">ms</span></div>
          <div class="sub">p95: ${s.translation_ms?.p95 ?? "—"}ms</div>
        </div>
        <div class="stat-card">
          <h3>Retraso TTS observado</h3>
          <div class="value">${s.observed_tts_lag_ms?.p50 != null ? fmtSec(s.observed_tts_lag_ms.p50) : "—"}</div>
          <div class="sub">Solo si TTS estaba activo</div>
        </div>
        <div class="stat-card">
          <h3>Presión de cola</h3>
          <div class="value">${s.backlog_pressure_pct != null ? s.backlog_pressure_pct + "%" : "—"}</div>
          <div class="sub">frases más rápidas que la traducción</div>
        </div>
      </div></div>`;

      (data.hints || []).forEach((h) => {
        html += `<div class="hint-card ${h.level || "info"}"><p>${escapeHtml(h.text)}</p></div>`;
      });

      html += `<div class="section"><h2>Configuración de la sesión</h2>
        <div class="config-list">
          VAD: ${cfg.vad_silence_ms}ms · Modelo final: ${cfg.final_model}<br>
          Polish reservado: ${cfg.polish_ms_per_utterance}ms/frase · TTS est.: ${cfg.ms_per_es_char_tts_est}ms/carácter ES
        </div></div>`;

      if ((data.utterances || []).length) {
        html += `<div class="section"><details>
          <summary>Detalle por frase (${data.utterances.length})</summary>
          <table class="raw"><thead><tr>
            <th>t</th><th>KO</th><th>Trad.</th><th>TTS</th><th>Lag</th>
          </tr></thead><tbody>`;
        data.utterances.forEach((u) => {
          html += `<tr>
            <td>${u.elapsed_sec ?? "—"}s</td>
            <td>${escapeHtml(u.ko || "")}</td>
            <td>${u.translation_ms != null ? u.translation_ms + "ms" : "—"}</td>
            <td>${u.tts_playback_ms != null ? u.tts_playback_ms + "ms" : "—"}</td>
            <td>${u.observed_tts_lag_ms != null ? u.observed_tts_lag_ms + "ms" : "—"}</td>
          </tr>`;
        });
        html += `</tbody></table></details></div>`;
      }

      document.getElementById("content").innerHTML = html;
      document.getElementById("closeBtn").classList.remove("hidden");
    }

    async function loadCurrent() {
      const res = await fetch("/api/live/speech-analytics");
      const data = await res.json();
      if (data.ok) {
        render(data);
        return true;
      }
      return false;
    }

    async function loadSessionsList() {
      const res = await fetch("/api/analytics/sessions");
      const data = await res.json();
      if (!data.ok || !(data.sessions || []).length) return;

      const pick = document.getElementById("sessionPick");
      const sel = document.getElementById("sessionSelect");
      pick.classList.remove("hidden");
      sel.innerHTML = "";
      data.sessions.forEach((s, i) => {
        const opt = document.createElement("option");
        opt.value = s.file;
        const when = s.recorded_at ? s.recorded_at.slice(0, 16).replace("T", " ") : s.file;
        opt.textContent = `${when} · ${s.utterance_count ?? "?"} frases`;
        if (i === 0) opt.selected = true;
        sel.appendChild(opt);
      });

      sel.onchange = async () => {
        const file = sel.value;
        const r = await fetch(`/api/analytics/sessions/${encodeURIComponent(file)}`);
        const d = await r.json();
        if (d.ok) render(d);
      };
    }

    async function load() {
      const hasCurrent = await loadCurrent();
      if (!hasCurrent) {
        const res = await fetch("/api/analytics/sessions");
        const data = await res.json();
        const sessions = data.sessions || [];
        if (sessions.length && !sessions[0].error) {
          const r = await fetch(
            `/api/analytics/sessions/${encodeURIComponent(sessions[0].file)}`
          );
          const d = await r.json();
          if (d.ok) {
            render(d);
            await loadSessionsList();
            return;
          }
        }
        document.getElementById("content").innerHTML =
          `<div class="empty">${"No hay informe disponible."}<br><br>
          Finalice una transmisión en vivo con /captions conectado (mín. 3 frases).</div>`;
        return;
      }
      await loadSessionsList();
    }

    document.getElementById("closeBtn").onclick = () => window.close();
    load();
  </script>
</body>
</html>
