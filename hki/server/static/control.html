<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HKI 실시간 번역 — 운영자</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .container { max-width: 640px; margin: 0 auto; padding: 1.5rem; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    header h1 { font-size: 1.25rem; }
    .settings-toggle { background: none; border: 1px solid #2a2a3e; color: #8888aa; padding: 0.4rem 0.8rem; font-size: 0.85rem; border-radius: 6px; }
    .settings-panel { margin-bottom: 1rem; }
    .setting-row { margin-bottom: 0.75rem; }
    .setting-row label { display: block; font-size: 0.85rem; color: #8888aa; margin-bottom: 0.25rem; }
    .level-bar { height: 8px; background: #2a2a3e; border-radius: 4px; overflow: hidden; margin-top: 0.25rem; }
    .level-fill { height: 100%; background: #27ae60; transition: width 0.1s, background 0.2s; border-radius: 4px; }
    .level-label { font-size: 0.8rem; color: #8888aa; margin-top: 0.2rem; }
    .timer { font-size: 2rem; font-weight: 700; text-align: center; margin: 1rem 0; font-variant-numeric: tabular-nums; }
    .controls { display: flex; gap: 0.75rem; margin-bottom: 1rem; }
    .controls button { flex: 1; }
    .preview { background: #12121f; border-radius: 8px; padding: 0.75rem; font-size: 0.9rem; }
    .preview .ko { color: #8888aa; margin-bottom: 0.25rem; }
    .preview .es-draft { color: #888; font-style: italic; }
    .preview .es-final { color: #e8e8f0; }
    .url-box { background: #12121f; border-radius: 8px; padding: 0.75rem; font-size: 0.85rem; word-break: break-all; margin-bottom: 1rem; }
    .url-box a { color: #4a6cf7; }
    select { width: 100%; padding: 0.5rem; background: #1a1a2e; border: 1px solid #2a2a3e; color: #e8e8f0; border-radius: 6px; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 0.4rem; }
    .status-dot.live { background: #e74c3c; animation: pulse 1.5s infinite; }
    .status-dot.paused { background: #e67e22; }
    .status-dot.idle { background: #555; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>HKI 실시간 번역</h1>
      <button class="settings-toggle" id="settingsToggle">⚙ 설정</button>
    </header>

    <div class="url-box" id="urlBox">
      청중 자막: <a id="captionsUrl" href="#" target="_blank">로딩 중...</a>
    </div>

    <div class="settings-panel hidden" id="settingsPanel">
      <div class="setting-row">
        <label>입력 디바이스</label>
        <select id="deviceSelect"></select>
      </div>
      <div class="setting-row">
        <label>Gain: <span id="gainValue">1.0</span>x</label>
        <input type="range" id="gainSlider" min="0.1" max="4.0" step="0.1" value="1.0">
      </div>
      <div class="setting-row">
        <label>입력 레벨</label>
        <div class="level-bar"><div class="level-fill" id="levelFill" style="width:0%"></div></div>
        <div class="level-label" id="levelLabel">-60 dB</div>
      </div>
      <button class="btn-secondary" id="monitorBtn" style="width:100%">입력 테스트</button>
    </div>

    <div class="card">
      <h3>성경 본문</h3>
      <textarea id="bibleText" placeholder="오늘 설교 본문을 붙여넣기"></textarea>
    </div>

    <div class="card">
      <h3>설교 원고</h3>
      <textarea id="manuscriptText" placeholder="설교 원고를 붙여넣기"></textarea>
    </div>

    <div id="idleControls">
      <button class="btn-primary" id="startBtn">▶ 스트리밍 시작</button>
    </div>

    <div id="liveControls" class="hidden">
      <div class="timer">
        <span class="status-dot" id="statusDot"></span>
        <span id="timerDisplay">00:00:00</span>
      </div>
      <div class="controls">
        <button class="btn-warning" id="pauseBtn">⏸ 일시정지</button>
        <button class="btn-danger" id="stopBtn">■ 방송 종료</button>
      </div>
    </div>

    <div class="preview" id="preview" style="margin-top:1rem">
      <div class="ko" id="previewKo"></div>
      <div class="es-draft" id="previewDraft"></div>
      <div class="es-final" id="previewFinal"></div>
    </div>
  </div>

  <script src="/static/control.js"></script>
</body>
</html>
